name: issue-notes

# ⚠️ 临时工作流（用完即删）。
#
# 存在原因：本机代理阻断 `github.com` 的 POST（OAuth 设备流 / gh auth login 全部 000），
# 本地也没有可用的 PAT，因此无法从命令行以维护者身份回帖。
# 仓库自身的 GITHUB_TOKEN 具备 issues:write，用它代发一次，跑完就删掉这个文件。
#
# 幂等：评论带隐藏标记，重复运行只会跳过；关单本身也是幂等操作。
on:
  push:
    paths:
      - ".github/workflows/issue-notes.yml"

permissions:
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- buddy-switch-bot -->";
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const notes = {
              27: [
                "两支都做了，main 上已合并：",
                "",
                "- `3d55bde` / `3453deb` / `95a6154` — 时点改为 `HH:MM`（`checkin_times: [\"09:07\"]`），",
                "  旧 `*_hours: [9, 21]` 仍可读、保存一次自动迁移；设置页换成原生时间选择器，可精确到分钟。",
                "- `8c4ad64` — 每个任务新增「抖动」：`*_jitter_minutes`（`0` = 关，默认全 0），",
                "  实际触发 = 时点 ± N 分钟。",
                "",
                "抖动的三个取舍（都可以再调）：",
                "",
                "1. 偏移是**确定性**的（按 任务 / 日期 / 幅度 派生），不是每次重新掷骰子。",
                "   否则重启一次触发时间就变、日志两次对不上、测试只能断言「大致在范围内」。",
                "2. 上限 60 分钟。再大就不是「错开同一分钟」，而是把任务推进另一个时段了。",
                "3. 默认关闭 —— 老用户升级后触发时刻一个字不变。",
                "",
                "可点原型（设置 → 签到与积分）：`docs/redesign/index.html`、`docs/redesign/buddy-switch-prototype.html`；",
                "验收脚本 `docs/redesign/verify-jitter.cjs`（12 条断言 + `--mutate=jitter` 变异验证）。",
                "",
                "> 本条由仓库 CI 代发（本机无可用 GitHub 凭据，OAuth 端点被代理阻断）。",
              ].join("\n"),

              37: [
                "两条根因都已在 main 修复：`17b744e`（`data_dir_base()` 三平台统一认 `APPDATA` 覆盖，",
                "写路径 `restore_from_slot_*` 一并收敛）、`a13d337`（`legacy_trae_path_migrates_into_its_region`",
                "改用平台无关路径）。本地 Windows 全量 1428 通过，main 的 pr-check 全绿。",
                "",
                "但 macOS 侧仍待复跑确认 —— 补充一个事实：`pr-check.yml` 的 rust job 只在 `ubuntu-latest` 上跑，",
                "`build.yml` 的 `macos-14` 只产出 bundle、不跑 `cargo test`。也就是说这 6 条**无法由 CI 复跑证明**，",
                "需要在 macOS 机器上手动跑一次 `cargo test -p buddy-switch-core --lib`。",
                "如果要根治，得给 pr-check 加一个 macOS runner。",
                "",
                "> 本条由仓库 CI 代发（本机无可用 GitHub 凭据，OAuth 端点被代理阻断）。",
              ].join("\n"),
            };

            for (const [num, body] of Object.entries(notes)) {
              const issue_number = Number(num);
              const { data: existing } = await github.rest.issues.listComments({ ...repo, issue_number, per_page: 100 });
              if (existing.some((c) => (c.body || "").includes(MARKER))) {
                core.info(`#${issue_number} 已有代发评论，跳过`);
                continue;
              }
              await github.rest.issues.createComment({ ...repo, issue_number, body: `${MARKER}\n${body}` });
              core.info(`#${issue_number} 已回帖`);
            }

            // #27 是功能请求，两支都实现并合并 ⇒ 标记完成并关闭。
            await github.rest.issues.update({ ...repo, issue_number: 27, state: "closed", state_reason: "completed" });
            core.info("#27 已关闭（completed）");
